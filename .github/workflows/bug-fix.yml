# .github/workflows/claude-bug-fix.yml
name: Claude Bug Fix

on:
  workflow_dispatch:
    inputs:
      bug_summary:
        description: 'Short summary of the bug from Slack'
        required: true
        type: string
      bug_context:
        description: 'Full Slack thread with all context'
        required: true
        type: string
      slack_link:
        description: 'Link back to the Slack thread'
        required: false
        type: string

jobs:
  fix-bug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "claude-bot@your-domain.com"
          git config --global user.name "Claude Bot"

      - name: Run Claude Code to fix the bug
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A bug was reported in Slack. Here is the context:

            **Summary:** ${{ inputs.bug_summary }}

            **Full thread (includes reproduction steps,
            developer notes, and follow-up discussion):**

            ${{ inputs.bug_context }}

            DO NOT attempt to fetch or open this URL — it requires
            authentication and is only included for reference in
            the PR body:
            **Slack thread:** ${{ inputs.slack_link }}

            Your task:
            1. Read the bug report carefully. Pay attention to
               reproduction steps and any file paths or component
               names mentioned in the thread.
            2. Search the codebase to locate the relevant files.
            3. Identify the root cause.
            4. Implement a minimal, focused fix. Do not refactor
               unrelated code.
            5. Run existing tests to make sure nothing breaks.
            6. Complete the full git workflow. Run each command
               as a SEPARATE Bash call — do not chain with && or ;
               a. git checkout -b fix/slack-bug-<short-slug>
               b. git add <changed files>
               c. git commit -m "fix: <description>"
               d. git push -u origin fix/slack-bug-<short-slug>
               e. gh pr create \
                    --title "fix: <description>" \
                    --label bug \
                    --label automated-fix \
                    --label slack-reported \
                    --body "<body with root cause, fix applied,
                    and the Slack thread URL>"

          claude_args: |
            --model claude-sonnet-4-20250514
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git *),Bash(gh pr *),Bash(gh label *),Bash(npm test *),Bash(npm run *),Bash(npx *)"
