name: Slack Bug Auto-Fix

on:
  workflow_dispatch:
    inputs:
      bug_description:
        description: "Bug report extracted from Slack thread"
        required: true
        type: string
      slack_thread_url:
        description: "Link to the Slack thread for context"
        required: false
        type: string
      slack_channel:
        description: "Slack channel where the bug was reported"
        required: false
        type: string
      reported_by:
        description: "Slack user who reported the bug"
        required: false
        type: string

jobs:
  fix-bug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code to fix the bug
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          branch_prefix: "fix/slack-bug"
          direct_prompt: |
            A bug was reported in the Slack #${{ github.event.inputs.slack_channel }} channel by ${{ github.event.inputs.reported_by }}.

            The full thread content has already been extracted and is provided below.
            DO NOT attempt to fetch or open the Slack URL — it requires authentication and is only included for reference in the PR body.

            **Slack thread (reference link only):** ${{ github.event.inputs.slack_thread_url }}

            **Bug report (full thread content):**
            ${{ github.event.inputs.bug_description }}

            Your task:
            1. Read and understand the bug report above carefully.
            2. Explore the codebase to find the relevant code that is causing this issue.
            3. Implement a minimal, focused fix — do not refactor unrelated code.
            4. Make sure the fix is correct and does not introduce new issues.
            5. Create a new git branch named fix/slack-bug-<short-description>, commit your changes, and open a pull request using the `gh` CLI with:
               - A clear title like "fix: <what was fixed>"
               - A body that explains the root cause, the fix applied, and references the Slack thread URL above
               - Labels: bug automated-fix slack-reported (add with --label flag, one per --label flag)

            IMPORTANT conventions for this project (sanaa-glam):
            - Next.js 14 App Router, TypeScript, Tailwind CSS, PostgreSQL (Supabase), Prisma ORM
            - All date/time logic uses `Europe/Berlin` timezone via `TIMEZONE` constant in `src/lib/constants.ts`
            - Use `fromZonedTime()` (Berlin→UTC for storage) and `formatInTimeZone()` (UTC→Berlin for display)
            - API routes return `{ success: boolean, error?: string, data?: any }`
            - Use server components by default; only add `"use client"` for interactive components
            - Price fields are `Decimal` in DB — convert with `Number()` for calculations
